<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ODEN.EXE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    overflow-x: hidden;
  }
  #rain {
    position: fixed; inset: 0;
    z-index: 0;
    opacity: 0.85;
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 430px; margin: 0 auto;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 28px 40px;
  }
  h1 {
    font-family: Impact, "Arial Black", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 40px; font-weight: 400; letter-spacing: 2px;
    text-align: center; line-height: 1.25;
    color: #eaffef;
    text-shadow:
      0 0 4px rgba(190,255,205,0.9),
      0 0 12px rgba(57,255,106,0.95),
      0 0 26px rgba(0,232,84,0.85),
      0 0 54px rgba(0,232,84,0.65),
      0 0 90px rgba(0,200,70,0.5);
    white-space: nowrap;
    animation: neonFlicker 4.2s infinite;
  }
  @keyframes neonFlicker {
    0%, 100% { opacity: 1; }
    3% { opacity: 0.72; }
    5% { opacity: 1; }
    42% { opacity: 1; }
    44% { opacity: 0.6; }
    46% { opacity: 1; }
    47% { opacity: 0.82; }
    49% { opacity: 1; }
  }
  .photo {
    width: 184px; height: 184px; border-radius: 50%;
    background: #fff; color: #666;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    margin: 44px 0 48px;
    overflow: hidden; flex: none;
    box-shadow: 0 0 0 6px rgba(0,0,0,0.35);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .links { width: 100%; display: flex; flex-direction: column; gap: 22px; }
  a.btn {
    display: flex; align-items: center;
    background: #fff; color: #000; text-decoration: none;
    border-radius: 18px; height: 70px; padding: 0 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.55);
  }
  a.btn:active { transform: scale(0.98); }
  .icon {
    width: 44px; height: 44px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { display: block; }
  .label {
    flex: 1; text-align: center;
    font-family: Impact, "Arial Black", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 28px; font-weight: 400; letter-spacing: 1px;
    margin-right: 44px;
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <h1>ODEN.EXE</h1>

  <div class="photo" id="photo"><img src="photo.jpg" alt="Oden" /></div>

  <div class="links">
    <a class="btn" href="https://www.instagram.com/oden_evolved/" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="42" height="42" viewBox="0 0 42 42"><defs><linearGradient id="igg" x1="0" y1="42" x2="42" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#feda75"/><stop offset="0.35" stop-color="#fa7e1e"/><stop offset="0.6" stop-color="#d62976"/><stop offset="0.82" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1" y="1" width="40" height="40" rx="10" fill="url(#igg)"/><rect x="9.5" y="9.5" width="23" height="23" rx="6.5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="21" cy="21" r="5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="29" cy="13" r="1.9" fill="#fff"/></svg>
      </span>
      <span class="label">Instagram</span>
    </a>

    <a class="btn" href="https://www.youtube.com/watch?v=lysaExfrp7s" target="_blank" rel="noopener">
      <span class="icon">
        <svg width="42" height="42" viewBox="0 0 42 42"><rect x="1" y="8" width="40" height="26" rx="7" fill="#ff0000"/><path d="M17.5 15.5 L28 21 L17.5 26.5 Z" fill="#fff"/></svg>
      </span>
      <span class="label">Youtube</span>
    </a>

    <a class="btn" href="https://oden-life.studio.site/" target="_blank" rel="noopener">
      <span class="icon">
        <span style="width:44px;height:44px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;">
          <img src="icon-home.png" alt="" style="height:32px;width:auto;display:block;" />
        </span>
      </span>
      <span class="label">Home page</span>
    </a>
  </div>
</div>

<script>
  // ODEN rain — falling characters with trails
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const CHARS = ['お','で','ん','オ','デ','ン','O','D','E','N','o','d','e','n'];
  const FONT = 20;
  let W, H, columns = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.floor(W / FONT);
    columns = [];
    for (let i = 0; i < count; i++) {
      const chars = [];
      for (let j = 0; j < 24; j++) chars.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
      columns.push({
        x: i * FONT + 2,
        y: Math.random() * -60,
        speed: 0.35 + Math.random() * 0.55,   // readable pace
        trail: 10 + Math.floor(Math.random() * 10),
        chars: chars
      });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function pick() { return CHARS[Math.floor(Math.random() * CHARS.length)]; }

  // ~20fps keeps the falling characters readable
  let last = 0;
  function loop(ts) {
    if (ts - last > 50) { last = ts; draw(); }
    requestAnimationFrame(loop);
  }
  function draw() {
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '700 ' + FONT + 'px "Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
    ctx.textBaseline = 'top';
    for (const c of columns) {
      for (let t = c.trail; t >= 1; t--) {
        const ty = (c.y - t) * FONT;
        if (ty < -FONT || ty > H) continue;
        const a = 0.05 + (1 - t / c.trail) * 0.34;
        ctx.fillStyle = 'rgba(0,232,84,' + a.toFixed(3) + ')';
        ctx.fillText(c.chars[t % c.chars.length], c.x, ty);
      }
      const hy = c.y * FONT;
      if (hy > -FONT && hy < H + FONT) {
        ctx.fillStyle = 'rgba(196,255,208,0.98)';
        ctx.fillText(c.chars[0], c.x, hy);
      }
      c.y += c.speed;
      // occasionally shuffle the column's characters
      if (Math.random() < 0.02) c.chars[Math.floor(Math.random() * c.chars.length)] = pick();
      if (c.y * FONT > H + c.trail * FONT) {
        c.y = Math.random() * -30;
        c.speed = 0.35 + Math.random() * 0.55;
      }
    }
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
